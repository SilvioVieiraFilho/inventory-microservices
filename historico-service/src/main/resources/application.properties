
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

spring.profiles.active=dev

spring.kafka.consumer.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=historico-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.application.name=historico-service

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory

spring.datasource.username=postgres
spring.datasource.password=123456



spring.kafka.consumer.properties.spring.json.value.default.type=com.produtoapi.historicoservice.dto.ProdutoEventoDTO



server.port=8081