name: CI Pipeline with Docker and k6

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JAVA 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # START CONTAINERS
      - name: Start containers
        run: |
          set -e

          docker compose -f infra/docker-compose.yml up -d --build

          echo "Containers started"

      # WAIT SERVICES
      - name: Wait services startup
        run: sleep 90

      # VALIDATE CONTAINERS
      - name: Validate containers
        run: |

          docker compose -f infra/docker-compose.yml ps

          # Verifica containers que falharam
          if docker compose -f infra/docker-compose.yml ps | grep -q "Exit"; then
            echo "One or more containers exited unexpectedly"

            docker compose -f infra/docker-compose.yml logs

            exit 1
          fi

      # WAIT HEALTHCHECK
      - name: Wait for produto-service healthcheck
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect --format="{{json .State.Health.Status }}" produto-service)" == "\"healthy\"" ]; do
              echo "Waiting produto-service healthcheck..."
              sleep 5
            done
          '

      # INSTALL K6
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # LOGIN TEST
      - name: Execute Login Load Test
        run: |
          k6 run infra/k6/login-test.js

      # PRODUTO POST TEST
      - name: Execute Produto POST Test
        run: |
          k6 run infra/k6/produto-post-test.js

      # PRODUTO GET TEST
      - name: Execute Produto GET Test
        run: |
          k6 run infra/k6/produto-get-test.js

      # SHOW LOGS IF FAIL
      - name: Show container logs
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml logs

      # STOP CONTAINERS
      - name: Stop containers
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down
