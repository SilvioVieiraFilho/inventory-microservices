name: CI Pipeline (Docker + k6)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: http://localhost:8080
      CATEGORY_NAME: categoria-ci

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # =========================================================
      # START STACK
      # =========================================================
      - name: Start Docker stack
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Show containers
        run: docker compose -f infra/docker-compose.yml ps

      # =========================================================
      # WAIT POSTGRES (robusto)
      # =========================================================
      - name: Wait PostgreSQL
        run: |
          for i in {1..30}; do
            docker exec postgres-db pg_isready -U postgres && exit 0
            echo "Waiting PostgreSQL..."
            sleep 5
          done
          docker logs postgres-db
          exit 1

      # =========================================================
      # WAIT KAFKA (mais confiável)
      # =========================================================
      - name: Wait Kafka
        run: |
          for i in {1..30}; do
            docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && exit 0
            echo "Waiting Kafka..."
            sleep 5
          done
          docker logs kafka
          exit 1

      # =========================================================
      # WAIT SERVICES (health check real)
      # =========================================================
      - name: Wait services
        run: |
          for i in {1..60}; do

            PRODUTO=$(docker inspect -f '{{.State.Health.Status}}' produto-service 2>/dev/null || echo "starting")
            HIST=$(docker inspect -f '{{.State.Health.Status}}' historico-service 2>/dev/null || echo "starting")

            echo "produto-service: $PRODUTO | historico-service: $HIST"

            if [ "$PRODUTO" = "healthy" ] && [ "$HIST" = "healthy" ]; then
              exit 0
            fi

            sleep 5
          done

          docker logs produto-service
          docker logs historico-service
          exit 1

      # =========================================================
      # CREATE TEST USER
      # =========================================================
      - name: Create test user
        run: |
          curl -s -X POST $BASE_URL/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","senha":"123456"}'

      # =========================================================
      # K6 INSTALL
      # =========================================================
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # =========================================================
      # LOGIN TEST
      # =========================================================
      - name: Login test (k6)
        run: k6 run infra/k6/login-test.js

      # =========================================================
      # CREATE CATEGORY (FIXADO E SEGURO)
      # =========================================================
      - name: Create category
        run: |
          RESPONSE=$(curl -s -X POST $BASE_URL/categorias \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"$CATEGORY_NAME\",\"descricaoCategoria\":\"ci test\"}")

          echo "Response: $RESPONSE"

          CATEGORY_ID=$(echo "$RESPONSE" | jq -r '.id // .data.id // .categoriaId')

          if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
            echo "CATEGORY ERROR"
            exit 1
          fi

          echo "CATEGORY_ID=$CATEGORY_ID" >> $GITHUB_ENV

      # =========================================================
      # PRODUCT TEST
      # =========================================================
      - name: Produto POST test
        run: k6 run infra/k6/produto-test.js
        env:
          CATEGORY_ID: ${{ env.CATEGORY_ID }}

      - name: Produto GET stress test
        run: k6 run infra/k6/stress-test.js

      # =========================================================
      # LOGS ON FAIL
      # =========================================================
      - name: Dump logs (only on failure)
        if: failure()
        run: |
          docker logs postgres-db || true
          docker logs kafka || true
          docker logs produto-service || true
          docker logs historico-service || true

      # =========================================================
      # CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
