name: CI Pipeline with Docker and k6

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # SETUP JAVA 21
      # =========================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # =========================================================
      # DOCKER INFO
      # =========================================================
      - name: Docker info
        run: |
          docker --version
          docker compose version

      # =========================================================
      # START CONTAINERS
      # =========================================================
      - name: Start containers
        run: |
          docker compose -f infra/docker-compose.yml up -d --build

      # =========================================================
      # SHOW CONTAINERS
      # =========================================================
      - name: Show containers
        run: |
          docker compose -f infra/docker-compose.yml ps

      # =========================================================
      # WAIT POSTGRESQL
      # =========================================================
      - name: Wait PostgreSQL
        run: |
          timeout 180 bash -c '

            until docker exec postgres-db pg_isready -U postgres; do
              echo "Waiting PostgreSQL..."
              sleep 5
            done

            echo "PostgreSQL is ready!"
          '

      # =========================================================
      # WAIT KAFKA
      # =========================================================
      - name: Wait Kafka
        run: |
          timeout 180 bash -c '

            until docker exec kafka \
              kafka-topics \
              --bootstrap-server localhost:9092 \
              --list > /dev/null 2>&1; do

              echo "Waiting Kafka..."
              sleep 5
            done

            echo "Kafka is ready!"
          '

      # =========================================================
      # VERIFY INFRASTRUCTURE
      # =========================================================
      - name: Verify infrastructure
        run: |

          echo "Checking PostgreSQL..."
          docker exec postgres-db pg_isready -U postgres

          echo "Checking Kafka..."
          docker exec kafka \
            kafka-topics \
            --bootstrap-server localhost:9092 \
            --list

          echo "Infrastructure is ready!"

      # =========================================================
      # WAIT PRODUTO SERVICE
      # =========================================================
      - name: Wait produto-service
        run: |
          timeout 300 bash -c '

            for i in {1..60}; do

              STATUS=$(docker inspect \
                --format="{{.State.Health.Status}}" \
                produto-service 2>/dev/null || echo "starting")

              echo "[$i/60] produto-service: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "produto-service is healthy!"
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then

                echo "produto-service became unhealthy"

                echo "========== PRODUTO LOGS =========="
                docker logs --tail 300 produto-service || true

                exit 1
              fi

              sleep 5
            done

            echo "Timeout waiting produto-service"

            docker logs produto-service || true

            exit 1
          '

      # =========================================================
      # WAIT HISTORICO SERVICE
      # =========================================================
      - name: Wait historico-service
        run: |
          timeout 300 bash -c '

            for i in {1..60}; do

              STATUS=$(docker inspect \
                --format="{{.State.Health.Status}}" \
                historico-service 2>/dev/null || echo "starting")

              echo "[$i/60] historico-service: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "historico-service is healthy!"
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then

                echo "historico-service became unhealthy"

                echo "========== HISTORICO LOGS =========="
                docker logs --tail 300 historico-service || true

                exit 1
              fi

              sleep 5
            done

            echo "Timeout waiting historico-service"

            docker logs historico-service || true

            exit 1
          '

      # =========================================================
      # VALIDATE CONTAINERS
      # =========================================================
      - name: Validate containers
        run: |

          docker compose -f infra/docker-compose.yml ps

          if docker compose -f infra/docker-compose.yml ps \
            | grep -E "Exit|Restarting|unhealthy"; then

            echo "Some containers are failing"

            echo "========== COMPOSE LOGS =========="
            docker compose -f infra/docker-compose.yml logs

            exit 1
          fi

          echo "All containers are healthy!"

      # =========================================================
      # CREATE TEST USER
      # =========================================================
      - name: Create test user
        run: |

          sleep 10

          curl -X POST http://localhost:8080/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "email":"silvio@email.com",
              "senha":"123456"
            }'

      # =========================================================
      # INSTALL K6
      # =========================================================
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # =========================================================
      # LOGIN LOAD TEST
      # =========================================================
      - name: Execute Login Load Test
        run: |
          k6 run infra/k6/login-test.js

      # =========================================================
      # PRODUTO POST TEST
      # =========================================================
      - name: Execute Produto POST Test
        run: |
          k6 run infra/k6/produto-post-test.js

      # =========================================================
      # PRODUTO GET TEST
      # =========================================================
      - name: Execute Produto GET Test
        run: |
          k6 run infra/k6/produto-get-test.js

      # =========================================================
      # SHOW LOGS
      # =========================================================
      - name: Show all logs
        if: always()
        run: |

          echo "========== POSTGRES =========="
          docker logs postgres-db || true

          echo "========== KAFKA =========="
          docker logs kafka || true

          echo "========== PRODUTO SERVICE =========="
          docker logs produto-service || true

          echo "========== HISTORICO SERVICE =========="
          docker logs historico-service || true

      # =========================================================
      # FINAL STATUS
      # =========================================================
      - name: Final status
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml ps

      # =========================================================
      # STOP CONTAINERS
      # =========================================================
      - name: Stop containers
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down -v --remove-orphans
