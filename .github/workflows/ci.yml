name: CI Pipeline with Docker and k6

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Start containers
        run: |
          docker compose -f infra/docker-compose.yml up -d --build

      - name: Show containers
        run: |
          docker compose -f infra/docker-compose.yml ps

      - name: Wait for produto-service healthcheck
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" produto-service)" = "healthy" ]; do
              status=$(docker inspect --format="{{.State.Health.Status}}" produto-service 2>/dev/null || echo "starting")
              echo "produto-service status: $status"
              sleep 5
            done
          '

      - name: Wait for historico-service healthcheck
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" historico-service)" = "healthy" ]; do
              status=$(docker inspect --format="{{.State.Health.Status}}" historico-service 2>/dev/null || echo "starting")
              echo "historico-service status: $status"
              sleep 5
            done
          '

      - name: Validate containers
        run: |
          docker compose -f infra/docker-compose.yml ps

          if docker compose -f infra/docker-compose.yml ps | grep -E "Exit|Restarting"; then
            echo "One or more containers failed"
            docker compose -f infra/docker-compose.yml logs
            exit 1
          fi

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Execute Login Load Test
        run: |
          k6 run infra/k6/login-test.js

      - name: Execute Produto POST Test
        run: |
          k6 run infra/k6/produto-post-test.js

      - name: Execute Produto GET Test
        run: |
          k6 run infra/k6/produto-get-test.js

      - name: Show container logs
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml logs

      - name: Stop containers
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down -v
