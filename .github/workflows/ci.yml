name: CI Pipeline with Docker and k6

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # JAVA 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # START CONTAINERS
      - name: Start containers
        run: |
          docker compose -f infra/docker-compose.yml up -d --build

      # SHOW CONTAINERS
      - name: Show containers
        run: |
          docker compose -f infra/docker-compose.yml ps

      # WAIT POSTGRES
      - name: Wait PostgreSQL
        run: |
          timeout 120 bash -c '
            until docker exec postgres-db pg_isready -U postgres; do
              echo "Waiting PostgreSQL..."
              sleep 5
            done
          '

      # WAIT KAFKA
      - name: Wait Kafka
        run: |
          timeout 120 bash -c '
            until docker logs kafka 2>&1 | grep -q "started (kafka.server.KafkaServer)"; do
              echo "Waiting Kafka..."
              sleep 5
            done
          '

      # WAIT PRODUTO SERVICE
      - name: Wait for produto-service healthcheck
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" produto-service)" = "healthy" ]; do
              status=$(docker inspect --format="{{.State.Health.Status}}" produto-service 2>/dev/null || echo "starting")
              echo "produto-service status: $status"
              sleep 5
            done
          '

      # WAIT HISTORICO SERVICE
      - name: Wait for historico-service healthcheck
        run: |
          timeout 180 bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" historico-service)" = "healthy" ]; do
              status=$(docker inspect --format="{{.State.Health.Status}}" historico-service 2>/dev/null || echo "starting")
              echo "historico-service status: $status"
              sleep 5
            done
          '

      # VALIDATE CONTAINERS
      - name: Validate containers
        run: |
          docker compose -f infra/docker-compose.yml ps

          if docker compose -f infra/docker-compose.yml ps | grep -E "Exit|Restarting"; then
            echo "One or more containers failed"

            docker compose -f infra/docker-compose.yml logs

            exit 1
          fi

      # INSTALL K6
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # LOGIN TEST
      - name: Execute Login Load Test
        run: |
          k6 run infra/k6/login-test.js

      # PRODUTO POST TEST
      - name: Execute Produto POST Test
        run: |
          k6 run infra/k6/produto-post-test.js

      # PRODUTO GET TEST
      - name: Execute Produto GET Test
        run: |
          k6 run infra/k6/produto-get-test.js

      # SHOW ALL LOGS
      - name: Show all logs
        if: always()
        run: |
          echo "========== PRODUTO SERVICE =========="
          docker logs produto-service || true

          echo "========== HISTORICO SERVICE =========="
          docker logs historico-service || true

          echo "========== KAFKA =========="
          docker logs kafka || true

          echo "========== POSTGRES =========="
          docker logs postgres-db || true

      # STOP CONTAINERS
      - name: Stop containers
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml down -v
