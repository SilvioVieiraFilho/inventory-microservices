name: CI Pipeline with Docker and k6

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 21
      # =========================================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # =========================================================
      # START DOCKER
      # =========================================================
      - name: Start containers
        run: docker compose -f infra/docker-compose.yml up -d --build

      - name: Show containers
        run: docker compose -f infra/docker-compose.yml ps

      # =========================================================
      # WAIT POSTGRES
      # =========================================================
      - name: Wait PostgreSQL
        run: |
          timeout 180 bash -c '
          until docker exec postgres-db pg_isready -U postgres; do
            echo "Waiting PostgreSQL..."
            sleep 5
          done
          '

      # =========================================================
      # WAIT KAFKA
      # =========================================================
      - name: Wait Kafka
        run: |
          timeout 180 bash -c '
          until docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1; do
            echo "Waiting Kafka..."
            sleep 5
          done
          '

      # =========================================================
      # VERIFY INFRA
      # =========================================================
      - name: Verify infrastructure
        run: |
          docker exec postgres-db pg_isready -U postgres
          docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list

      # =========================================================
      # WAIT SERVICES
      # =========================================================
      - name: Wait produto-service
        run: |
          timeout 300 bash -c '
          for i in {1..60}; do
            STATUS=$(docker inspect --format="{{.State.Health.Status}}" produto-service 2>/dev/null || echo "starting")
            echo "produto-service: $STATUS"

            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done

          docker logs produto-service
          exit 1
          '

      - name: Wait historico-service
        run: |
          timeout 300 bash -c '
          for i in {1..60}; do
            STATUS=$(docker inspect --format="{{.State.Health.Status}}" historico-service 2>/dev/null || echo "starting")
            echo "historico-service: $STATUS"

            [ "$STATUS" = "healthy" ] && exit 0
            sleep 5
          done

          docker logs historico-service
          exit 1
          '

      # =========================================================
      # CREATE TEST USER
      # =========================================================
      - name: Create test user
        run: |
          curl -s -X POST http://localhost:8080/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"silvio@email.com","senha":"123456"}'

      # =========================================================
      # INSTALL TOOLS
      # =========================================================
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # =========================================================
      # LOGIN TEST
      # =========================================================
      - name: Execute Login Load Test
        run: k6 run infra/k6/login-test.js

      # =========================================================
      # CREATE CATEGORY (ROBUSTO E SEGURO)
      # =========================================================
      - name: Create test category
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8080/categorias \
            -H "Content-Type: application/json" \
            -d '{
              "nome": "outra",
              "descricaoCategoria": "teste"
            }')

          echo "RAW RESPONSE: $RESPONSE"

          CATEGORY_ID=$(echo "$RESPONSE" | jq -r '.id // .data.id // .categoriaId')

          if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
            echo "❌ CATEGORY_ID inválido"
            echo "$RESPONSE"
            exit 1
          fi

          echo "CATEGORY_ID=$CATEGORY_ID" >> $GITHUB_ENV

          # garante propagação antes do k6
          sleep 5

      # =========================================================
      # PRODUCT TEST
      # =========================================================
      - name: Execute Produto POST Test
        run: k6 run infra/k6/produto-test.js
        env:
          CATEGORY_ID: ${{ env.CATEGORY_ID }}

      - name: Execute Produto GET Test
        run: k6 run infra/k6/stress-test.js

      # =========================================================
      # LOGS
      # =========================================================
      - name: Show logs
        if: always()
        run: |
          docker logs postgres-db || true
          docker logs kafka || true
          docker logs produto-service || true
          docker logs historico-service || true

      # =========================================================
      # CLEANUP
      # =========================================================
      - name: Stop containers
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans
