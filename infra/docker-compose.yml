services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: inventory

    ports:
      - "5432:5432"

    networks:
      - backend-network

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - backend-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - backend-network

  produto-service:
    build:
      context: ../produto-service

    container_name: produto-service

    ports:
      - "8080:8080"

    environment:

      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: BEQbV/vuYiPGqhpzJA/WC/D2soi2OqqrhfrdA9hlixk=

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - backend-network

  historico-service:
    build:
      context: ../historico-service

    container_name: historico-service

    ports:
      - "8081:8081"

    environment:

      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      JWT_SECRET: BEQbV/vuYiPGqhpzJA/WC/D2soi2OqqrhfrdA9hlixk=

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres-data:
