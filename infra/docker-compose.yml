version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend-network

  produto-service:
    build: ../produto-service
    container_name: produto-service

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      JWT_SECRET: minha-chave-secreta-super-forte-123456

    depends_on:
      - postgres

    networks:
      - backend-network

  historico-service:
    build: ../historico-service
    container_name: historico-service

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      JWT_SECRET: minha-chave-secreta-super-forte-123456

    depends_on:
      - postgres

    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge
